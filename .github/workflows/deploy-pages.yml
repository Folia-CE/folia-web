name: Deploy static site to Pages

# 纯静态版的发布链：构建 → 部署到 GitHub Pages。
#
# 这个 fork 没有服务器：产物就是 dist/ 里的一批静态文件，GitHub Pages 直接托管。
# 上游接口请求走浏览器（篡改猴中继脚本把请求从用户浏览器直连各家上游），所以
# Pages 上不需要任何 Node 服务端 —— 这正是「纯静态」的意思。
#
# 触发：推 main（或手动触发）。PR 上只跑 CI，不发布。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 的部署是串行的：后一次发布要等前一次结束，否则互相覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-latest-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
